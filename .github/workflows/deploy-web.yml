name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Dockerfile.web"
      - ".github/workflows/deploy-web.yml"

env:
  IMAGE: ghcr.io/hackatoan/wikiroll-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ env.IMAGE }}:latest
