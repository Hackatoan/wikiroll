<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161d2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f4ff"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="10%" r="55%">
      <stop offset="0%" style="stop-color:#4c1d95;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="90%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2138"/>
      <stop offset="100%" style="stop-color:#1e2952"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- wordmark -->
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="40" font-weight="900" fill="#7c3aed">🎲</text>
  <text x="135" y="148" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#8b5cf6" letter-spacing="-1">WikiRoll</text>

  <text x="80" y="270" font-family="Arial, sans-serif" font-size="76" font-weight="900" fill="url(#title)" letter-spacing="-2">Collect the Wiki</text>
  <text x="80" y="325" font-family="Arial, sans-serif" font-size="26" fill="#94a3b8">Roll characters from Wikipedia &amp; 150+ Fandom wikis.</text>
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="26" fill="#94a3b8">Claim them. Trade them. Build your collection.</text>

  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#c4b5fd">
    <rect x="80" y="400" width="130" height="38" rx="19" fill="rgba(139,92,246,0.14)" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <text x="145" y="425" text-anchor="middle">Naruto</text>
    <rect x="222" y="400" width="130" height="38" rx="19" fill="rgba(139,92,246,0.14)" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <text x="287" y="425" text-anchor="middle">Marvel</text>
    <rect x="364" y="400" width="180" height="38" rx="19" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="454" y="425" text-anchor="middle" fill="#fbbf24">Harry Potter</text>
  </g>

  <!-- floating card -->
  <g transform="translate(880,110) rotate(4)">
    <rect width="220" height="300" rx="14" fill="url(#card)" stroke="#8b5cf6" stroke-opacity="0.45"/>
    <rect x="16" y="16" width="90" height="22" rx="11" fill="rgba(124,58,237,0.25)"/>
    <text x="24" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#c4b5fd">FANDOM</text>
    <text x="110" y="150" font-family="Arial, sans-serif" font-size="52" text-anchor="middle">🍥</text>
    <text x="110" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#f0f4ff" text-anchor="middle">Naruto Uzumaki</text>
    <text x="110" y="226" font-family="Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" letter-spacing="1">NARUTOPEDIA</text>
    <rect x="16" y="252" width="188" height="32" rx="7" fill="#7c3aed"/>
    <text x="110" y="273" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">CLAIM</text>
  </g>

  <text x="80" y="580" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">wikiroll.hackatoa.com &#160;&#183;&#160; Free &#160;&#183;&#160; A Hackatoa Bot</text>
</svg>
